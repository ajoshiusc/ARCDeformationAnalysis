[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arc-deformation"
version = "1.3.0"
description = "Reproducible contralateral-normalized deformation analysis for chronic stroke MRI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-2.0-only"}
authors = [
  {name = "Anand A. Joshi", email = "ajoshi@usc.edu"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "matplotlib>=3.8",
  "nibabel>=5.2",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
ants = [
  "antspyx==0.6.1",
  "templateflow==25.1.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
arc-deformation = "arc_deformation.cli:main"

[project.urls]
Repository = "https://github.com/ajoshiusc/ARCDeformationAnalysis"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_deformation"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
